# TradeLab compose project. Fully separate from STAIR:
#   - explicit project name `tradelab` (containers tradelab-*, network
#     tradelab_internal, volume tradelab_pgdata), never the `stair` project;
#   - own Postgres, no published ports (reach it with `docker compose exec`);
#   - the bot uses Telegram long polling, so no inbound port is needed.
#
# Server: cd /home/avarela/tradelab && docker compose build && docker compose up -d
name: tradelab

x-app: &app
  image: tradelab-app:latest
  build:
    context: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tradelab}
  networks:
    - internal

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB:       ${POSTGRES_DB:-tradelab}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-tradelab}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - internal
    # NO ports: never exposed.

  # One-shot: applies pending migrations, then exits.
  migrate:
    <<: *app
    command: ["python", "database/migrate.py"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    <<: *app
    command: ["python", "-m", "tradelab.bot"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
